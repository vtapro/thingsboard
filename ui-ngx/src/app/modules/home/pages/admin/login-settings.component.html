<div>
  <mat-card appearance="outlined" class="settings-card">
    <mat-card-header>
      <mat-card-title>
        <span class="mat-headline-5" translate>admin.login-white-labeling</span>
      </mat-card-title>
    </mat-card-header>
    @if (isLoading$ | async) {
      <mat-progress-bar color="warn" mode="indeterminate"></mat-progress-bar>
    }
    @if (!(isLoading$ | async)) {
      <div style="height: 4px;"></div>
    }
    <mat-card-content>
      <div class="tb-ls-host">
        <span translate>admin.login-current-host</span>: <b>{{ currentHost }}</b>
      </div>
      <div class="tb-white-labeling-hint" translate>admin.login-hint</div>
      <div class="tb-ls-add">
        <mat-form-field class="tb-ls-field" subscriptSizing="dynamic" appearance="outline">
          <mat-label translate>admin.login-domain-name</mat-label>
          <input matInput [formControl]="domainControl" placeholder="iot.example.com">
        </mat-form-field>
        <button mat-raised-button color="primary" type="button" (click)="addDomain()">
          {{ 'admin.login-create-domain' | translate }}
        </button>
      </div>
      <table mat-table [dataSource]="domains" class="mat-elevation-z0 tb-ls-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef translate>admin.login-domain-name</th>
          <td mat-cell *matCellDef="let domain">{{ domain.name }}</td>
        </ng-container>
        <ng-container matColumnDef="createdTime">
          <th mat-header-cell *matHeaderCellDef translate>admin.login-created-time</th>
          <td mat-cell *matCellDef="let domain">{{ domain.createdTime }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let domain">
            <button mat-icon-button type="button" (click)="deleteDomain(domain)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
