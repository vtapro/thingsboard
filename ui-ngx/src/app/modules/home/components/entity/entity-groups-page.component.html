<mat-tab-group>
  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon class="tb-tab-icon">{{ allIcon() }}</mat-icon>
      <span class="tb-tab-text">All</span>
    </ng-template>
    @if (entitiesTableConfig) {
      <tb-entities-table [entitiesTableConfig]="entitiesTableConfig"></tb-entities-table>
    }
  </mat-tab>
  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon class="tb-tab-icon">group_work</mat-icon>
      <span class="tb-tab-text">Groups</span>
    </ng-template>
    <tb-entity-groups [entityType]="entityType"></tb-entity-groups>
  </mat-tab>
</mat-tab-group>
