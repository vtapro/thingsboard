<h2 mat-dialog-title>{{ 'entity-group.add-members' | translate }}</h2>
<mat-dialog-content class="tb-add-entities-content">
  @if (loading) {
    <mat-progress-bar color="warn" mode="indeterminate"></mat-progress-bar>
  }
  @if (!loading) {
    @if (!entities.length) {
      <div class="tb-add-entities-empty">{{ 'entity-group.no-entities' | translate }}</div>
    }
    <div class="tb-add-entities-list">
      @for (entity of entities; track entity.id) {
        <mat-checkbox class="tb-add-entities-item"
                      [checked]="isSelected(entity.id)"
                      (change)="toggle(entity.id, $event.checked)">
          {{ entity.name }}
        </mat-checkbox>
      }
    </div>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <span class="tb-add-entities-count">{{ 'entity-group.selected-count' | translate: {count: selectedIds.length} }}</span>
  <span class="flex-1"></span>
  <button mat-button type="button" (click)="cancel()">{{ 'action.cancel' | translate }}</button>
  <button mat-raised-button color="primary" type="button" (click)="save()">{{ 'action.save' | translate }}</button>
</mat-dialog-actions>
