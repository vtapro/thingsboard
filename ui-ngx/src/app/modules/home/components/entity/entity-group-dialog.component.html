<h2 mat-dialog-title>{{ isEdit ? 'Edit entity group' : 'Add entity group' }}</h2>
<mat-dialog-content class="tb-entity-group-dialog-content">
  <form [formGroup]="groupForm" class="flex flex-col">
    <mat-form-field class="mat-block" subscriptSizing="dynamic" appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" required>
      @if (groupForm.get('name').hasError('required')) {
        <mat-error>Name is required</mat-error>
      }
    </mat-form-field>
    <mat-form-field class="mat-block" subscriptSizing="dynamic" appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput rows="3" formControlName="description"></textarea>
    </mat-form-field>
    <mat-checkbox formControlName="publicGroup">Public</mat-checkbox>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" type="button" (click)="save()"
          [disabled]="groupForm.invalid">
    {{ isEdit ? 'Save' : 'Add' }}
  </button>
</mat-dialog-actions>
