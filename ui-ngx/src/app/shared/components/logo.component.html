@if (isExternal) {
  <a [href]="link" [target]="target">
    <ng-container *ngTemplateOutlet="logo"></ng-container>
  </a>
} @else {
  <a [routerLink]="link" [target]="target">
    <ng-container *ngTemplateOutlet="logo"></ng-container>
  </a>
}

<ng-template #logo>
  <img [src]="logoSrc" aria-label="logo" alt="Logo"
       [style.height.px]="logoHeightPx"
       [style.width]="logoHeightPx ? 'auto' : null"/>
</ng-template>
