# Webroot used to obtain and renew the Let's Encrypt certificate for app.greeniq.vn.
#
# HAProxy routes /.well-known/acme-challenge/ to the nginx below, certbot writes the challenge
# files into the same PVC, so the validation works no matter which of the two workers Let's
# Encrypt decides to contact (the DNS has an A record for each of them).
#
#   kubectl apply -f deploy/k3s/31-acme-webroot.yaml
#   kubectl -n thingsboard delete job tb-certbot --ignore-not-found
#   kubectl apply -f deploy/k3s/31-certbot-issue.yaml     # issues the certificate
#   kubectl -n thingsboard logs job/tb-certbot -f
#
# The certificate files land in the PVC (see scripts/use-letsencrypt-cert.ps1 which turns them
# into the tb-haproxy-tls Secret and restarts HAProxy).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tb-acme-webroot
  namespace: thingsboard
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tb-acme-nginx
  namespace: thingsboard
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      location /.well-known/acme-challenge/ {
        root /webroot;
      }
      location / {
        return 404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tb-acme
  namespace: thingsboard
  labels:
    app.kubernetes.io/name: tb-acme
    app.kubernetes.io/part-of: thingsboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tb-acme
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tb-acme
        app.kubernetes.io/part-of: thingsboard
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: webroot
              mountPath: /webroot
            - name: conf
              mountPath: /etc/nginx/conf.d
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: webroot
          persistentVolumeClaim:
            claimName: tb-acme-webroot
        - name: conf
          configMap:
            name: tb-acme-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: tb-acme
  namespace: thingsboard
  labels:
    app.kubernetes.io/name: tb-acme
    app.kubernetes.io/part-of: thingsboard
spec:
  selector:
    app.kubernetes.io/name: tb-acme
  ports:
    - name: http
      port: 8080
      targetPort: http
