# One shot preparation of the in-cluster Cassandra, run once after the node is up (the deploy script
# does it before the ThingsBoard services are rolled):
#   * wait until the CQL port answers,
#   * create the keyspace with NetworkTopologyStrategy and one replica per datacenter.
#
# ThingsBoard connects without credentials (CASSANDRA_USE_CREDENTIALS=false in 01-config.yaml), the
# same way the Ubuntu installation guide links a local Cassandra to ThingsBoard, so only the keyspace
# is needed here. The tables are created by the tb-install job (10-install-job.yaml).
#
#   kubectl apply -f deploy/k3s/06b-cassandra-init.yaml
#   kubectl -n thingsboard wait --for=condition=complete job/tb-cassandra-init --timeout=15m
#
# It is idempotent: CREATE KEYSPACE IF NOT EXISTS.
apiVersion: batch/v1
kind: Job
metadata:
  name: tb-cassandra-init
  namespace: thingsboard
  labels:
    app.kubernetes.io/name: tb-cassandra-init
    app.kubernetes.io/part-of: thingsboard
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tb-cassandra-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: cqlsh
          image: cassandra:4.1
          imagePullPolicy: IfNotPresent
          env:
            - name: CASSANDRA_HOST
              value: tb-cassandra
            - name: CASSANDRA_PORT
              value: "9042"
            - name: CASSANDRA_KEYSPACE_NAME
              value: greeniq
            - name: CASSANDRA_LOCAL_DATACENTER
              value: DC1
          command:
            - sh
            - -c
            - |
              set -e

              cql() {
                cqlsh "$CASSANDRA_HOST" "$CASSANDRA_PORT" -e "$1"
              }

              echo "==> waiting for Cassandra at $CASSANDRA_HOST:$CASSANDRA_PORT"
              until cql "SELECT now() FROM system.local" >/dev/null 2>&1; do
                sleep 10
              done

              echo "==> creating the keyspace $CASSANDRA_KEYSPACE_NAME"
              cql "CREATE KEYSPACE IF NOT EXISTS $CASSANDRA_KEYSPACE_NAME WITH replication = {'class': 'NetworkTopologyStrategy', '$CASSANDRA_LOCAL_DATACENTER': 1} AND durable_writes = true;"

              echo "==> keyspaces:"
              cql "SELECT keyspace_name FROM system_schema.keyspaces;"

              echo "==> done"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
