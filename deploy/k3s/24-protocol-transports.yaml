  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tb-snmp-transport
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tb-snmp-transport
        app.kubernetes.io/part-of: thingsboard
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
