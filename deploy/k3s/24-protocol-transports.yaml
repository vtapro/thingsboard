# CoAP, LwM2M and SNMP transports — optional, one Deployment per protocol, each one with its own
# image. The container ports are the standard ThingsBoard ports:
#
#   CoAP      5683/UDP (plain), 5684/UDP (DTLS)
#   LwM2M     5685/UDP (plain), 5686/UDP (DTLS), 5687/UDP (bootstrap), 5688/UDP (bootstrap DTLS)
#   SNMP      161/UDP
#
# UDP cannot go through HAProxy, so these services are exposed directly as NodePort (the cluster
# has no LoadBalancer). The node port numbers must live in 30000-32767, hence the mapping below:
# use the DNAT/firewall rule in the docs if the exact public port is required.
#
# These modules disable their web server by default; WEB_APPLICATION_* is enabled here only so
# that /actuator/health can be used as probe.

# ---- CoAP: 5683/UDP + 5684/UDP (DTLS, enable with COAP_DTLS_ENABLED=true + certificate) -----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tb-coap-transport
  namespace: thingsboard
  labels:
    app.kubernetes.io/name: tb-coap-transport
    app.kubernetes.io/part-of: thingsboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tb-coap-transport
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tb-coap-transport
        app.kubernetes.io/part-of: thingsboard
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: tb-coap-transport
          image: ghcr.io/vtapro/tb-coap-transport:v4.4.0.0
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: tb-common
            - secretRef:
                name: tb-secrets
          env:
            - name: TB_SERVICE_TYPE
              value: tb-transport
            - name: TB_SERVICE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: COAP_BIND_ADDRESS
              value: 0.0.0.0
            - name: COAP_BIND_PORT
              value: "5683"
            - name: COAP_DTLS_BIND_ADDRESS
              value: 0.0.0.0
            - name: COAP_DTLS_BIND_PORT
              value: "5684"
            - name: WEB_APPLICATION_ENABLE
              value: "true"
            - name: WEB_APPLICATION_TYPE
              value: servlet
            - name: HTTP_BIND_PORT
              value: "8080"
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/config/cache-specs.yml
          volumeMounts:
            - name: cache-specs
              mountPath: /config
              readOnly: true
          ports:
            - name: coap
              containerPort: 5683
              hostPort: 5683
              protocol: UDP
            - name: coap-dtls
              containerPort: 5684
              hostPort: 5684
              protocol: UDP
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: cache-specs
          configMap:
            name: tb-cache-specs
---
apiVersion: v1
kind: Service
metadata:
  name: tb-coap-transport
  namespace: thingsboard
  labels:
    app.kubernetes.io/name: tb-coap-transport
    app.kubernetes.io/part-of: thingsboard
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: tb-coap-transport
  ports:
    - name: coap
      port: 5683
      targetPort: coap
      protocol: UDP
      nodePort: 30683
    - name: coap-dtls
      port: 5684
      targetPort: coap-dtls
      protocol: UDP
      nodePort: 30684
---
# ---- LwM2M: 5685/UDP, 5686/UDP (DTLS), 5687/UDP (bootstrap), 5688/UDP (bootstrap DTLS) -------
