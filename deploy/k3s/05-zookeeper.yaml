# ZooKeeper is the discovery service of the ThingsBoard cluster: every pod registers itself
# here and every pod learns where the others are. It also stores the rule engine partition
# assignment, so it must be running before tb-core / tb-rule-engine start.
#
# Single replica is enough for this cluster; for HA run three replicas on three nodes with
# ZOO_SERVERS listing all of them (ZooKeeper needs an odd number of members for quorum).
apiVersion: v1
kind: Service
metadata:
  name: tb-zookeeper
  namespace: thingsboard
  labels:
    app.kubernetes.io/name: tb-zookeeper
    app.kubernetes.io/part-of: thingsboard
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: tb-zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: client
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tb-zookeeper
  namespace: thingsboard
  labels:
    app.kubernetes.io/name: tb-zookeeper
    app.kubernetes.io/part-of: thingsboard
spec:
  serviceName: tb-zookeeper
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tb-zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tb-zookeeper
        app.kubernetes.io/part-of: thingsboard
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: zookeeper
          image: zookeeper:3.9.3
          ports:
            - name: client
              containerPort: 2181
            - name: follower
              containerPort: 2888
            - name: election
              containerPort: 3888
          env:
            - name: ZOO_MY_ID
              value: "1"
            - name: ZOO_SERVERS
              value: server.1=tb-zookeeper-0.tb-zookeeper.thingsboard.svc.cluster.local:2888:3888;2181
            - name: ZOO_4LW_COMMANDS_WHITELIST
              value: ruok,stat,srvr
            - name: ZOO_TICK_TIME
              value: "2000"
            - name: ZOO_MAX_SESSION_TIMEOUT
              value: "60000"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: conf
              mountPath: /conf
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        # the image writes zoo.cfg here on startup
        - name: conf
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
