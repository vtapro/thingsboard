# tb-core: REST API, entity/telemetry handling, web UI, edge gRPC (7070).
# Scale horizontally; every replica is stateless and joins the cluster through ZooKeeper
# and Kafka. Bump maxReplicas when the API latency or the Kafka consumer lag grows.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tb-core
  namespace: thingsboard
  labels:
    app.kubernetes.io/name: tb-core
    app.kubernetes.io/part-of: thingsboard
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tb-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tb-core
        app.kubernetes.io/part-of: thingsboard
    spec:
      terminationGracePeriodSeconds: 90
      # GHCR packages are private: create the secret with
      #   kubectl -n thingsboard create secret docker-registry ghcr --docker-server=ghcr.io ...
      imagePullSecrets:
        - name: ghcr
      # the cluster has two workers: keep the replicas on different nodes when possible
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tb-core
      containers:
        - name: tb-core
          # tb-node image: same jar as tb-rule-engine, role selected by TB_SERVICE_TYPE
          image: ghcr.io/vtapro/tb-node:v4.4.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: tb-common
            - secretRef:
                name: tb-secrets
          env:
            - name: TB_SERVICE_TYPE
              value: tb-core
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/config/cache-specs.yml
            # unique cluster node id — the pod name is unique inside the namespace
            - name: TB_SERVICE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: EDGES_ENABLED
              value: "true"
            - name: JS_EVALUATOR
              value: remote
          ports:
            - name: http
              containerPort: 8080
            - name: edge-grpc
              containerPort: 7070
          volumeMounts:
            # Cassandra truststore (self-signed cluster CA of the managed service)
            - name: cassandra-tls
              mountPath: /certs
              readOnly: true
            - name: cache-specs
              mountPath: /config
              readOnly: true
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: cassandra-tls
          secret:
            secretName: tb-cassandra-tls
        - name: cache-specs
          configMap:
            name: tb-cache-specs
---
apiVersion: v1
kind: Service
metadata:
  name: tb-core
  namespace: thingsboard
  labels:
    app.kubernetes.io/name: tb-core
    app.kubernetes.io/part-of: thingsboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tb-core
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: edge-grpc
      port: 7070
      targetPort: edge-grpc

# NOTE: the HorizontalPodAutoscaler was removed from this file on purpose. With 2 workers
# (8 vCPU total) the CPU based autoscaling scaled tb-core to 4 replicas during startup and the
# nodes ran out of CPU, so the replicas are fixed at 2 for now. To scale automatically later,
# raise the cpu request first and re-add:
#
#   apiVersion: autoscaling/v2
#   kind: HorizontalPodAutoscaler
#   metadata: { name: tb-core, namespace: thingsboard }
#   spec:
#     scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: tb-core }
#     minReplicas: 2
#     maxReplicas: 4
#     metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
