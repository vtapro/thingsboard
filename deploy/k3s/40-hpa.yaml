# HorizontalPodAutoscaler cho các service co giãn ngang được.
# - min 1: khi ít tải chỉ chạy 1 pod (tiết kiệm RAM/CPU)
# - max giữ thấp có chủ đích: tb-rule-engine bị giới hạn bởi số partition của topic RE
#   (xem TB_QUEUE_KAFKA_RE_TOPIC_PROPERTIES trong 01-config.yaml) - muốn max cao hơn phải tăng partition trước.
# - scaleDown có stabilization window 5 phút để tránh lên/xuống liên tục.
#
# Cần metrics-server (đã có trong cụm: `kubectl top nodes` chạy được) và resource requests (đã set trong các manifest).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tb-core
  namespace: thingsboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tb-core
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tb-rule-engine
  namespace: thingsboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tb-rule-engine
  minReplicas: 2
  # Phase 0 (2026-09-28): queue Main đã tăng lên 32 partition nên có thể chạy nhiều replica hơn.
  # Trần cũ 2 replica chính là thứ chặn rule-engine khi tải 1.000 thiết bị (290 %/70 %).
  # Trần mới 4 để còn vừa CPU/RAM của 3 worker hiện tại; lên 8 chỉ sau khi thêm worker (Phase 1).
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
