#
# HorizontalPodAutoscaler cho các service co giãn ngang được.
# - min 1: khi ít tải chỉ chạy 1 pod (tiết kiệm RAM/CPU)
# - max giữ thấp có chủ đích: tb-rule-engine bị giới hạn bởi số partition của topic RE
#   (xem TB_QUEUE_KAFKA_RE_TOPIC_PROPERTIES trong 01-config.yaml) - muốn max cao hơn phải tăng partition trước.
# - scaleDown có stabilization window 5 phút để tránh lên/xuống liên tục.
#
# Cần metrics-server (đã có trong cụm: `kubectl top nodes` chạy được) và resource requests (đã set trong các manifest).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tb-core
  namespace: thingsboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tb-core
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tb-rule-engine
  namespace: thingsboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tb-rule-engine
  minReplicas: 1
  # 2 = số replica đang chạy an toàn với số partition hiện tại của topic RE; tăng max chỉ sau khi tăng partition
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
