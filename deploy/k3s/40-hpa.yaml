# HorizontalPodAutoscaler cho các service co giãn ngang được.
#
# >>> GIAI ĐOẠN ÍT TẢI (2026-10-01): mọi service đang được ghim `minReplicas=maxReplicas=1` (1 pod/service) để
#     tiết kiệm CPU/RAM khi ít người dùng và ít telemetry. Muốn bật lại co giãn: đặt `maxReplicas` theo bảng
#     dưới đây (16 cho core/rule-engine/js-executor/mqtt, 8 cho web-ui/http) rồi `kubectl apply -f 40-hpa.yaml`
#     (hoặc `kubectl -n thingsboard patch hpa <name> --type=merge -p '{"spec":{"maxReplicas":N}}'`).
#
# Nguyên tắc: muốn "thêm node + thêm pod = tăng chịu tải" thì max replicas phải <= số partition
# của queue mà pod đó tiêu thụ, nếu không pod thừa sẽ ngồi không:
#   * tb-rule-engine  <= TB_QUEUE_RULE_ENGINE_PARTITIONS (32)  -> max 16 (dư địa gấp đôi khi cần)
#   * tb-core         <= TB_QUEUE_CORE_PARTITIONS (32) và <= partitions của tb_transport.api.requests (64)
#   * tb-js-executor  <= partitions của tb_js_executor topic (30)
#   * tb-mqtt/http-transport không bị giới hạn bởi partition (chúng là producer); trần thật là số connection
#     và CPU/RAM của node, nên max đặt theo số node dự kiến.
#
# Muốn nâng max lên nữa: tăng partition tương ứng trong 01-config.yaml (và cập nhật queue trong Tenant profile
# với các cụm đã cài) TRƯỚC, rồi mới nâng max ở đây. Xem deploy/k3s/SCALING.md.
#
# min 1-2: khi ít tải chỉ chạy vài pod (tiết kiệm RAM/CPU). scaleDown có stabilization window 5 phút để tránh
# lên/xuống liên tục.
#
# Cần metrics-server (đã có trong cụm: `kubectl top nodes` chạy được) và resource requests (đã set trong các
# manifest). Khi cụm lớn hơn, chuyển các HPA của queue consumer (rule-engine, core, js-executor) sang scale theo
# Kafka consumer lag (KEDA / prometheus-adapter) thay vì CPU — lúc đó mới phản ánh đúng nghẽn queue.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tb-core
  namespace: thingsboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tb-core
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tb-rule-engine
  namespace: thingsboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tb-rule-engine
  minReplicas: 1
  # Trần = TB_QUEUE_RULE_ENGINE_PARTITIONS / 2. Read the partition count from the Tenant profile queue
  # (Main/HighPriority/SequentialByOriginator) before raising this value.
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tb-web-ui
  namespace: thingsboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tb-web-ui
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tb-js-executor
  namespace: thingsboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tb-js-executor
  minReplicas: 1
  # Trần = partitions của topic tb_js_executor (TB_QUEUE_KAFKA_JE_TOPIC_PROPERTIES, mặc định 30).
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tb-mqtt-transport
  namespace: thingsboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tb-mqtt-transport
  # 2 replica thường trực: lúc bắt đầu bão kết nối transport cần sẵn sàng, không chờ HPA.
  minReplicas: 1
  # MQTT transport là producer (không bị giới hạn bởi partition); trần thật là số connection + CPU/RAM của node.
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tb-http-transport
  namespace: thingsboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tb-http-transport
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
