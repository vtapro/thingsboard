apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tb-mqtt-transport
  namespace: thingsboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tb-mqtt-transport
  # Phase 0 (2026-09-28): giữ 2 replica thường trực — để 1 replica thì lúc bắt đầu bão kết nối
  # transport đuối (connect phase 26–31 s) và cả bài đo bị chậm theo.
  minReplicas: 2
  # Phase 0 (2026-09-28): 1.000 thiết bị đã đẩy mqtt-transport lên 347 %/70 % và chạm trần 3.
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
