# One shot schema install/upgrade. Run it once per release, before rolling the services:
#
#   kubectl apply -f deploy/k3s/10-install-job.yaml
#   kubectl -n thingsboard wait --for=condition=complete job/tb-install --timeout=15m
#   kubectl -n thingsboard delete job tb-install
#
# The services run with RUN_INSTALL=false, so a pod restart never triggers a migration.
apiVersion: batch/v1
kind: Job
metadata:
  name: tb-install
  namespace: thingsboard
  labels:
    app.kubernetes.io/name: tb-install
    app.kubernetes.io/part-of: thingsboard
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tb-install
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: tb-install
          image: ghcr.io/vtapro/tb-node:v4.4.0.0
          envFrom:
            - configMapRef:
                name: tb-common
            - secretRef:
                name: tb-secrets
          env:
            - name: RUN_INSTALL
              value: "true"
            - name: RUN_INSTALL_ONLY
              value: "true"
            - name: TB_SERVICE_TYPE
              value: monolith
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
