# One shot schema install/upgrade. Run it once per release, before rolling the services:
#
#   kubectl apply -f deploy/k3s/10-install-job.yaml
#   kubectl -n thingsboard wait --for=condition=complete job/tb-install --timeout=15m
#   kubectl -n thingsboard delete job tb-install
#
# NOTE: the installer creates the system administrator unconditionally, so this job only works on a
# database that has no system data yet. To apply the schema/system upgrades of a new release on an
# installed database, run it with INSTALL_UPGRADE=true instead (scripts/deploy-k3s.ps1 -InstallUpgrade):
# the upgrade path updates the schema, the views/functions, the rule nodes and the system widgets
# without touching the existing users.
#
# The services run with RUN_INSTALL=false, so a pod restart never triggers a migration.
apiVersion: batch/v1
kind: Job
metadata:
  name: tb-install
  namespace: thingsboard
  labels:
    app.kubernetes.io/name: tb-install
    app.kubernetes.io/part-of: thingsboard
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tb-install
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: tb-install
          image: ghcr.io/vtapro/tb-node:v4.4.0.8
          envFrom:
            - configMapRef:
                name: tb-common
            - secretRef:
                name: tb-secrets
          env:
            - name: RUN_INSTALL
              value: "true"
            - name: RUN_INSTALL_ONLY
              value: "true"
            - name: INSTALL_UPGRADE
              value: "false"
            - name: TB_SERVICE_TYPE
              value: monolith
          volumeMounts:
            # the installer creates the Cassandra schema, so it needs the truststore too
            - name: cassandra-tls
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: cassandra-tls
          secret:
            secretName: tb-cassandra-tls
