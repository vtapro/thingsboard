# HTTP transport: /api/v1/** device endpoints (telemetry, attributes, rpc, provisioning).
# It is a separate deployment from tb-core on purpose so that device traffic never competes
# with the web UI and the REST API of the platform.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tb-http-transport
  namespace: thingsboard
  labels:
    app.kubernetes.io/name: tb-http-transport
    app.kubernetes.io/part-of: thingsboard
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tb-http-transport
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tb-http-transport
        app.kubernetes.io/part-of: thingsboard
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: ghcr
      # the cluster has two workers: keep the replicas on different nodes when possible
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tb-http-transport
      containers:
        - name: tb-http-transport
          image: ghcr.io/vtapro/tb-http-transport:v4.4.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: tb-common
            - secretRef:
                name: tb-secrets
          env:
            - name: TB_SERVICE_TYPE
              value: tb-transport
            - name: TB_SERVICE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HTTP_BIND_ADDRESS
              value: 0.0.0.0
            - name: HTTP_BIND_PORT
              value: "8080"
            - name: HTTP_REQUEST_TIMEOUT
              value: "60000"
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/config/cache-specs.yml
          volumeMounts:
            - name: cache-specs
              mountPath: /config
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: cache-specs
          configMap:
            name: tb-cache-specs
---
apiVersion: v1
kind: Service
metadata:
  name: tb-http-transport
  namespace: thingsboard
  labels:
    app.kubernetes.io/name: tb-http-transport
    app.kubernetes.io/part-of: thingsboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tb-http-transport
  ports:
    - name: http
      port: 8080
      targetPort: http
