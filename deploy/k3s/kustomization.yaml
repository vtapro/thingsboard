# kubectl apply -k deploy/k3s
#
# The tb-secrets Secret and the image tag are not managed here: create the secret with
# kubectl (see 02-secret.example.yaml) and set the image in every manifest, or patch the
# image globally with `kubectl -n thingsboard set image`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: thingsboard
resources:
  - 00-namespace.yaml
  - 01-config.yaml
  # PostgreSQL + Cassandra hosted outside the cluster (edit the IPs before applying)
  - 03-external-databases.yaml
  # in-cluster infrastructure
  - 04-kafka.yaml
  - 05-zookeeper.yaml
  - 06-redis.yaml
  - 10-install-job.yaml
  - 20-tb-core.yaml
  - 21-tb-rule-engine.yaml
  - 22-tb-mqtt-transport.yaml
  - 23-tb-http-transport.yaml
  # optional: CoAP / LwM2M / SNMP — delete the file if these protocols are not used
  - 24-protocol-transports.yaml
  - 30-ingress.yaml
  # temporary access while there is no ingress controller on the cluster
  - 40-bringup-nodeport.yaml
