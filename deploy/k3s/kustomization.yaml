# kubectl apply -k deploy/k3s
#
# The tb-secrets Secret and the image tag are not managed here: create the secret with
# kubectl (see 02-secret.example.yaml) and set the image in every manifest, or patch the
# image globally with `kubectl -n thingsboard set image`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: thingsboard
resources:
  - 00-namespace.yaml
  - 01-config.yaml
  # in-cluster infrastructure
  - 04-kafka.yaml
  - 05-zookeeper.yaml
  # Kafka/ZooKeeper accept connections only from pods of this namespace
  - 07-network-policies.yaml
  # cache.specs shared by every service (the transport yml has none, and there is no Redis)
  - 09-cache-specs.yaml
  - 10-install-job.yaml
  - 20-tb-core.yaml
  - 21-tb-rule-engine.yaml
  - 22-tb-mqtt-transport.yaml
  - 23-tb-http-transport.yaml
  # optional: CoAP / LwM2M / SNMP — delete the file if these protocols are not used
  - 24-protocol-transports.yaml
  - 25-tb-web-ui.yaml
  - 26-tb-js-executor.yaml
  # edge: HAProxy owns app.greeniq.vn (HTTP/HTTPS) and the public MQTT port
  - 30-haproxy.yaml
  # alternative edge based on ingress-nginx — requires an ingress controller, keep only one of the two
  # - 30-ingress.yaml
