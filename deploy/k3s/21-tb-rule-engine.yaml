# tb-rule-engine: executes rule chains. Entities (devices, tenants, ...) are partitioned
# between the replicas through Kafka, so scaling up/down rebalances the load automatically.
# No Service is required: the pods are reached through Kafka and ZooKeeper only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tb-rule-engine
  namespace: thingsboard
  labels:
    app.kubernetes.io/name: tb-rule-engine
    app.kubernetes.io/part-of: thingsboard
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tb-rule-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tb-rule-engine
        app.kubernetes.io/part-of: thingsboard
    spec:
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
        - name: ghcr
      # the cluster has two workers: keep the replicas on different nodes when possible
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tb-rule-engine
      containers:
        - name: tb-rule-engine
          image: ghcr.io/vtapro/tb-node:v4.4.0.0
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: tb-common
            - secretRef:
                name: tb-secrets
          env:
            - name: TB_SERVICE_TYPE
              value: tb-rule-engine
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/config/cache-specs.yml
            - name: TB_SERVICE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # "remote" needs the tb-js-executor deployment; use "local" for a smaller cluster.
            - name: JS_EVALUATOR
              value: remote
            # Default in thingsboard.yml is 2000 ms (TB_QUEUE_RULE_ENGINE_PACK_PROCESSING_TIMEOUT_MS).
            # Every telemetry message goes through the "Save Timeseries" rule node, i.e. a write to the
            # managed Cassandra at ~110 ms RTT; under load a pack of 100+ messages easily needs more than
            # 2 s and was reported as "Timeout to process" (messages dropped). 30 s = same order as the
            # transport side default (60 s). Measured: docs/capacity-load-test.md §5.
            - name: TB_QUEUE_RULE_ENGINE_PACK_PROCESSING_TIMEOUT_MS
              value: "30000"
            # Optional: pin this replica to specific tenant profiles (isolation feature).
            # - name: TB_RULE_ENGINE_ASSIGNED_TENANT_PROFILES
            #   value: "profile-uuid-1,profile-uuid-2"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            # Cassandra truststore (self-signed cluster CA of the managed service)
            - name: cassandra-tls
              mountPath: /certs
              readOnly: true
            - name: cache-specs
              mountPath: /config
              readOnly: true
          startupProbe:
            # the rule engine secures /actuator/** (403), so the probe only checks the listener;
            # the rule chains themselves are registered in ZooKeeper a few seconds later
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: cassandra-tls
          secret:
            secretName: tb-cassandra-tls
        - name: cache-specs
          configMap:
            name: tb-cache-specs

# NOTE: the HorizontalPodAutoscaler was removed from this file on purpose. With 2 workers
# (8 vCPU total) the CPU based autoscaling scaled tb-core to 4 replicas during startup and the
# nodes ran out of CPU, so the replicas are fixed at 2 for now. To scale automatically later,
# raise the cpu request first and re-add:
#
#   apiVersion: autoscaling/v2
#   kind: HorizontalPodAutoscaler
#   metadata: { name: tb-core, namespace: thingsboard }
#   spec:
#     scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: tb-core }
#     minReplicas: 2
#     maxReplicas: 4
#     metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
