# MQTT transport: device connection point (devices/me/telemetry, rpc, ...).
# Every replica serves any device, no session affinity is required.
#
# The Service is internal on purpose: devices reach MQTT through HAProxy (30-haproxy.yaml), which
# owns the public port 31883. Set type: NodePort (nodePort: 31883) only if HAProxy is not used.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tb-mqtt-transport
  namespace: thingsboard
  labels:
    app.kubernetes.io/name: tb-mqtt-transport
    app.kubernetes.io/part-of: thingsboard
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tb-mqtt-transport
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tb-mqtt-transport
        app.kubernetes.io/part-of: thingsboard
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: ghcr
      # the cluster has two workers: keep the replicas on different nodes when possible
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tb-mqtt-transport
      containers:
        - name: tb-mqtt-transport
          image: ghcr.io/vtapro/tb-mqtt-transport:v4.4.0.0
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: tb-common
            - secretRef:
                name: tb-secrets
          env:
            - name: TB_SERVICE_TYPE
              value: tb-transport
            - name: TB_SERVICE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MQTT_BIND_ADDRESS
              value: 0.0.0.0
            - name: MQTT_BIND_PORT
              value: "1883"
            - name: MQTT_TIMEOUT
              value: "10000"
            # MQTT over SSL (8883): enable together with the certificate secret
            # - name: MQTT_SSL_ENABLED
            #   value: "true"
            # - name: MQTT_SSL_BIND_PORT
            #   value: "8883"
            # - name: MQTT_SSL_CREDENTIALS_TYPE
            #   value: PEM
            # - name: MQTT_SSL_PEM_CERT
            #   value: /certs/mqtt-server.pem
            - name: NETTY_MAX_PAYLOAD_SIZE
              value: "65536"
            - name: NETTY_LEAK_DETECTOR_LVL
              value: DISABLED
            # this module disables the web server by default; enabled here for /actuator/health
            - name: WEB_APPLICATION_ENABLE
              value: "true"
            - name: WEB_APPLICATION_TYPE
              value: servlet
            - name: HTTP_BIND_PORT
              value: "8080"
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/config/cache-specs.yml
          volumeMounts:
            - name: cache-specs
              mountPath: /config
              readOnly: true
          ports:
            - name: mqtt
              containerPort: 1883
            - name: mqtts
              containerPort: 8883
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: cache-specs
          configMap:
            name: tb-cache-specs
---
apiVersion: v1
kind: Service
metadata:
  name: tb-mqtt-transport
  namespace: thingsboard
  labels:
    app.kubernetes.io/name: tb-mqtt-transport
    app.kubernetes.io/part-of: thingsboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tb-mqtt-transport
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
