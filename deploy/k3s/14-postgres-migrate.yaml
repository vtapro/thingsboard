# One shot migration of the ThingsBoard entities database into the in-cluster PostgreSQL.
#
# It reads the source database from the same ConfigMap/Secret the services use
# (`tb-common`: SPRING_DATASOURCE_URL, `tb-secrets`: SPRING_DATASOURCE_USERNAME/PASSWORD) and the
# target from the CloudNativePG application secret (`tb-pg-app`). The dump uses --no-owner and
# --no-privileges so that every object ends up owned by the application user of the new cluster.
#
# Run it while tb-core and tb-rule-engine are scaled to 0 (no writes during the copy):
#   kubectl -n thingsboard scale deployment/tb-core --replicas=0
#   kubectl -n thingsboard scale deployment/tb-rule-engine --replicas=0
#   kubectl -n thingsboard apply -f deploy/k3s/14-postgres-migrate.yaml
#   kubectl -n thingsboard wait --for=condition=complete job/tb-pg-migrate --timeout=30m
#   kubectl -n thingsboard logs job/tb-pg-migrate
#
# After the cutover (01-config.yaml points at tb-pg-pooler-rw, tb-secrets holds the tb-pg-app
# credentials) the old database can be kept as a rollback target and dropped later.
apiVersion: batch/v1
kind: Job
metadata:
  name: tb-pg-migrate
  namespace: thingsboard
  labels:
    app.kubernetes.io/part-of: thingsboard
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: thingsboard
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:18
          env:
            - name: SRC_JDBC
              valueFrom:
                configMapKeyRef: {name: tb-common, key: SPRING_DATASOURCE_URL}
            - name: SRC_USER
              valueFrom:
                secretKeyRef: {name: tb-secrets, key: SPRING_DATASOURCE_USERNAME}
            - name: SRC_PASS
              valueFrom:
                secretKeyRef: {name: tb-secrets, key: SPRING_DATASOURCE_PASSWORD}
            - name: DST_HOST
              value: tb-pg-rw.thingsboard.svc.cluster.local
            - name: DST_DB
              value: greeniq
            - name: DST_USER
              valueFrom:
                secretKeyRef: {name: tb-pg-app, key: username}
            - name: DST_PASS
              valueFrom:
                secretKeyRef: {name: tb-pg-app, key: password}
          command: ["/bin/sh","-c"]
          args:
            - |
              set -e
              U="${SRC_JDBC#jdbc:postgresql://}"
              HP="${U%%/*}"
              SRC_DB="${U#*/}"; SRC_DB="${SRC_DB%%\?*}"
              SRC_HOST="${HP%%:*}"; SRC_PORT="${HP##*:}"
              SRC="host=$SRC_HOST port=$SRC_PORT dbname=$SRC_DB user=$SRC_USER sslmode=require"
              DST="host=$DST_HOST port=5432 dbname=$DST_DB user=$DST_USER sslmode=require"
              echo "==> source: $SRC_HOST:$SRC_PORT/$SRC_DB"
              echo "==> target: $DST_HOST/$DST_DB as $DST_USER"
              PGPASSWORD="$DST_PASS" psql "$DST" -c "select current_user as restored_as, current_database();"
              echo "==> copying (pg_dump | psql)"
              # the target database already contains the "public" schema (created by initdb), so the
              # CREATE SCHEMA/ALTER SCHEMA statements of the dump are dropped
              PGPASSWORD="$SRC_PASS" pg_dump --no-owner --no-privileges --schema=public "$SRC" \
                | sed -e '/^CREATE SCHEMA public;/d' -e '/^ALTER SCHEMA public /d' \
                | PGPASSWORD="$DST_PASS" psql -v ON_ERROR_STOP=1 -q "$DST"
              echo "==> verify"
              PGPASSWORD="$DST_PASS" psql "$DST" -c "select (select count(*) from information_schema.tables where table_schema='public') as tables, (select count(*) from device) as devices, (select count(*) from tb_user) as users, (select count(*) from admin_settings) as settings, (select count(*) from alarm) as alarms;"
              echo "==> done"
