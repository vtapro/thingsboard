# Shared configuration of every ThingsBoard service.
# Anything that is a secret lives in the tb-secrets Secret instead.
#
# Topology: PostgreSQL and Cassandra are managed database clusters outside k3s (each one on its
# own server, with TLS enabled and reached through its public host name); Kafka and ZooKeeper run
# inside the cluster (04-kafka.yaml, 05-zookeeper.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tb-common
  namespace: thingsboard
  labels:
    app.kubernetes.io/part-of: thingsboard
data:
  # ---- cluster / queue ------------------------------------------------------
  # Kafka is required in microservices mode: services only talk to each other through it.
  # Two options:
  #   a) Kafka already available elsewhere (managed service / another host): put its address
  #      below in host:port form and drop 04-kafka.yaml from kustomization.yaml;
  #   b) Kafka deployed in this cluster by 04-kafka.yaml: keep tb-kafka:9092.
  TB_QUEUE_TYPE: kafka
  TB_KAFKA_SERVERS: tb-kafka:9092
  # If the external broker needs TLS and/or SASL, see docs/production-k3s.md §3.1b:
  #   TB_KAFKA_SSL_ENABLED + truststore, or the SASL block (note: the Node.js js-executor does
  #   not support SASL, so with an authenticated Kafka use JS_EVALUATOR=local).
  # single broker in the cluster: raise to 3 together with a 3 broker Kafka setup
  TB_QUEUE_KAFKA_REPLICATION_FACTOR: "1"
  # ---- Kafka topic properties (applied when a topic is created) -------------
  # tb_transport.api.requests is a single topic with N partitions and is the hot path for every
  # device connect and telemetry message in microservices mode. Raised from the CE default of 10
  # to 30 because the measured ceiling of this cluster with 10 partitions was ~900-1.100 msg/s
  # (docs/capacity-load-test.md §5).
  # NOTE: this only applies to topics created afterwards. Resize an existing topic with:
  #   kubectl -n thingsboard exec tb-kafka-0 -- /opt/kafka/bin/kafka-topics.sh \
  #     --bootstrap-server localhost:9092 --alter --topic tb_transport.api.requests --partitions 30
  TB_QUEUE_KAFKA_TA_TOPIC_PROPERTIES: "retention.ms:604800000;segment.bytes:52428800;retention.bytes:1048576000;partitions:30;min.insync.replicas:1"
  # The rule-engine and core queues use one topic per partition (tb_rule_engine.main.0..9,
  # tb_rule_engine.hp.0..9, tb_core.0..9), so "partitions:1" per topic is correct; the
  # parallelism comes from the partition count of the queue itself (10). Keep
  # min.insync.replicas=1 while the cluster runs a single broker and raise it to 2 together
  # with TB_QUEUE_KAFKA_REPLICATION_FACTOR=3 (Phase 1 in docs/capacity-load-test.md).
  TB_QUEUE_KAFKA_RE_TOPIC_PROPERTIES: "retention.ms:604800000;segment.bytes:52428800;retention.bytes:1048576000;partitions:1;min.insync.replicas:1"
  # ZooKeeper is the discovery service used to find the other nodes of the cluster.
  ZOOKEEPER_ENABLED: "true"
  ZOOKEEPER_URL: tb-zookeeper:2181
  ZOOKEEPER_RETRY_INTERVAL_MS: "3000"
  ZOOKEEPER_CONNECTION_TIMEOUT_MS: "3000"
  ZOOKEEPER_SESSION_TIMEOUT_MS: "30000"

  # ---- databases ------------------------------------------------------------
  # Managed PostgreSQL (external): entities, relations, alarms, users, admin settings.
  # sslmode=require is mandatory; switch to verify-full once the CA certificate is published.
  SPRING_DRIVER_CLASS_NAME: org.postgresql.Driver
  # database "greeniq" (created in the CloudClusters console), user in tb-secrets
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql-215231-0.cloudclusters.net:10012/greeniq?sslmode=require
  # note: spring.jpa.hibernate.ddl-auto is already "none" in thingsboard.yml; the schema is
  # created/upgraded by the tb-install job only.
  # Managed Cassandra (external): telemetry. TLS is enabled by default on the server, so the
  # client has to use it too, and the host name inside CASSANDRA_URL must match the
  # certificate (hostname validation stays enabled).
  DATABASE_TS_TYPE: cassandra
  DATABASE_TS_LATEST_TYPE: cassandra
  CASSANDRA_URL: cassandra-215233-0.cloudclusters.net:19948
  # keyspace "greeniq" (already created in the CloudClusters console; the installer only runs
  # CREATE KEYSPACE IF NOT EXISTS, so the replication settings of the existing keyspace stay)
  CASSANDRA_KEYSPACE_NAME: greeniq
  # must match the datacenter name of the Cassandra cluster — verified with:
  #   SELECT data_center FROM system.local;   ->  DC1
  CASSANDRA_LOCAL_DATACENTER: DC1
  CASSANDRA_USE_CREDENTIALS: "true"
  CASSANDRA_USE_SSL: "true"
  # The server certificate is signed by the CloudClusters cluster CA (self-signed), which is not
  # in the JVM truststore, so the truststore downloaded from the console has to be mounted:
  #   kubectl -n thingsboard create secret generic tb-cassandra-tls \
  #     --from-file=cassandra.truststore.jks=./cassandra.truststore.jks
  # and its password goes to tb-secrets as CASSANDRA_SSL_TRUST_STORE_PASSWORD.
  CASSANDRA_SSL_TRUST_STORE: /certs/cassandra.truststore.jks
  # the certificate carries no host name (CN=US, OU=CassandraCluster), so hostname verification
  # cannot succeed; the connection is still encrypted and the CA is pinned through the truststore
  CASSANDRA_SSL_HOSTNAME_VALIDATION: "false"
  # the driver negotiates compression with the server; keep 'none' unless the Cassandra
  # server is explicitly configured for lz4
  CASSANDRA_COMPRESSION: none

  # ---- cache ----------------------------------------------------------------
  # No Redis in this deployment: every pod keeps its own in-process (caffeine) cache.
  # The application module reads the cache specs from thingsboard.yml, but the transport
  # modules ship their own yml without a "specs" section, so the specs are declared here as
  # environment variables (Spring relaxed binding). Without them the transports fail with
  # "Cache 'x' is not configured" as soon as CACHE_TYPE is caffeine.
  # TTL is 5 minutes for the caches whose staleness is visible (devices, credentials, sessions,
  # users, attributes, tenants, ...), otherwise the ThingsBoard default of 24 hours.
  CACHE_TYPE: caffeine

  # ---- device / session timeouts -------------------------------------------
  # The MQTT session inactivity timeout (TB_TRANSPORT_SESSIONS_INACTIVITY_TIMEOUT, ms) and the
  # device inactivity timeout (DEFAULT_INACTIVITY_TIMEOUT, s) must stay in sync. Both are left at
  # the ThingsBoard defaults (600000 ms = 600 s = 10 minutes), i.e. already consistent; if one is
  # ever changed, change the other as well.

  # ---- observability --------------------------------------------------------
  METRICS_ENABLED: "true"
  METRICS_ENDPOINTS_EXPOSE: "info,health,prometheus"
  # There is no Redis in this deployment, but spring-data-redis is on the classpath of every
  # service, so the actuator would report the (missing) Redis as DOWN and the readiness probe
  # would never pass. The indicator is disabled explicitly.
  MANAGEMENT_HEALTH_REDIS_ENABLED: "false"

  # ---- schema install -------------------------------------------------------
  # The image ships the SQL/Cassandra scripts in /app/data, used by the install job.
  INSTALL_DATA_DIR: /app/data
  # Never run a migration implicitly when a pod restarts; the install job does it.
  RUN_INSTALL: "false"

  # ---- fork specific --------------------------------------------------------
  # Custom RBAC of this fork. Set to "false" to fall back to stock CE behaviour.
  SECURITY_RBAC_ENABLED: "true"

  # ---- JVM ------------------------------------------------------------------
  # sized for the 2 worker cluster (4 vCPU / 8Gi each): heap well below the container limit
  JAVA_OPTS: "-Xms512M -Xmx2G -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=70"
