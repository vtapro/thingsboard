# Temporary access to the platform while the cluster has no ingress controller.
#
# The IngressClass "nginx" exists on the cluster but no controller is running, and there is no
# LoadBalancer implementation (no k3s servicelb, no MetalLB). This Service exposes tb-core on
# every node, so the platform is reachable immediately:
#
#   http://89.117.54.100:30080     (worker 1)
#   http://144.91.106.154:30080    (worker 2)
#
# Delete this file (kubectl delete -f deploy/k3s/40-bringup-nodeport.yaml) once ingress-nginx is
# installed and app.greeniq.vn resolves to the cluster.
apiVersion: v1
kind: Service
metadata:
  name: tb-core-nodeport
  namespace: thingsboard
  labels:
    app.kubernetes.io/name: tb-core
    app.kubernetes.io/part-of: thingsboard
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: tb-core
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
