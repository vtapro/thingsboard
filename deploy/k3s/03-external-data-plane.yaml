# Data plane hosted OUTSIDE the k3s cluster (the dedicated server that hosts PostgreSQL,
# Cassandra, Kafka and ZooKeeper), reachable from the cluster through a plain TCP link.
#
# EDIT THE IP ADDRESSES BELOW before applying: 203.0.113.x are documentation addresses
# (RFC 5737) and are guaranteed not to route anywhere — this file is meant to be edited,
# not used as is.
#
# A Service without a selector is bound to the Endpoints of the same name, so the
# host names used by the ConfigMap (tb-postgres, tb-cassandra, tb-kafka, tb-zookeeper,
# tb-redis) keep working inside the cluster and only the addresses change.
#
# Verify from a pod after applying:
#
#   kubectl -n thingsboard run netcheck --rm -it --restart=Never --image=busybox:1.37 -- \
#     sh -c "for p in tb-postgres:5432 tb-cassandra:9042 tb-kafka:9092 tb-zookeeper:2181; do \
#            nc -vz \${p%%:*} \${p##*:}; done"

# ---- PostgreSQL (entities, users, RBAC + white labeling admin settings) -------------
apiVersion: v1
kind: Service
metadata:
  name: tb-postgres
  namespace: thingsboard
  labels:
    app.kubernetes.io/part-of: thingsboard
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: tb-postgres
  namespace: thingsboard
subsets:
  - addresses:
      - ip: 203.0.113.10
    ports:
      - name: postgres
        port: 5432
        protocol: TCP
---
# ---- Cassandra (telemetry, DATABASE_TS_TYPE=cassandra) -------------------------------
apiVersion: v1
kind: Service
metadata:
  name: tb-cassandra
  namespace: thingsboard
  labels:
    app.kubernetes.io/part-of: thingsboard
spec:
  ports:
    - name: cql
      port: 9042
      targetPort: 9042
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: tb-cassandra
  namespace: thingsboard
subsets:
  - addresses:
      - ip: 203.0.113.10
    ports:
      - name: cql
        port: 9042
        protocol: TCP
---
# ---- Kafka (queue between the services: tb-core, tb-rule-engine, transports) ---------
# IMPORTANT: the address reaches the broker only if Kafka advertises an address that the
# pods can resolve and reach (advertised.listeners). See docs/production-k3s.md section 3.1.
apiVersion: v1
kind: Service
metadata:
  name: tb-kafka
  namespace: thingsboard
  labels:
    app.kubernetes.io/part-of: thingsboard
spec:
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: tb-kafka
  namespace: thingsboard
subsets:
  - addresses:
      - ip: 203.0.113.10
    ports:
      - name: kafka
        port: 9092
        protocol: TCP
---
# ---- ZooKeeper (discovery of the cluster nodes) --------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: tb-zookeeper
  namespace: thingsboard
  labels:
    app.kubernetes.io/part-of: thingsboard
spec:
  ports:
    - name: client
      port: 2181
      targetPort: 2181
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: tb-zookeeper
  namespace: thingsboard
subsets:
  - addresses:
      - ip: 203.0.113.10
    ports:
      - name: client
        port: 2181
        protocol: TCP
---
# ---- Redis / Valkey (shared cache) ---------------------------------------------------
# Mandatory only when CACHE_TYPE=redis (default for HA in 01-config.yaml).
# Remove this Service + Endpoints and set CACHE_TYPE: caffeine if the server has no Redis,
# knowing that every replica then keeps its own cache.
apiVersion: v1
kind: Service
metadata:
  name: tb-redis
  namespace: thingsboard
  labels:
    app.kubernetes.io/part-of: thingsboard
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: tb-redis
  namespace: thingsboard
subsets:
  - addresses:
      - ip: 203.0.113.10
    ports:
      - name: redis
        port: 6379
        protocol: TCP
