# PostgreSQL for ThingsBoard entities (the managed database outside the cluster is replaced by this
# one). Production profile:
#   * 3 instances spread over 3 nodes (anti-affinity required) -> automatic failover;
#   * Longhorn volumes (2 block replicas) + reclaimPolicy Retain;
#   * PgBouncer pooler in front (no connection storm from the TB pods);
#   * daily volume-snapshot backup kept by Longhorn, on top of the PostgreSQL continuous replication.
#
# Prerequisite: Longhorn + external-snapshotter + CloudNativePG (see 03-longhorn.md), and the
# storage classes from 12-longhorn-postgres-storage.yaml.
#
# ThingsBoard connects to the read-write pooler:
#   jdbc:postgresql://tb-pg-pooler-rw-rw.thingsboard.svc.cluster.local:5432/greeniq?sslmode=require
# The application credentials are generated by the operator in the Secret `tb-pg-app`.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tb-pg
  namespace: thingsboard
  labels:
    app.kubernetes.io/part-of: thingsboard
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  storage:
    storageClass: longhorn-postgres
    size: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    # one PostgreSQL instance per node: losing a node must not take two instances down
    podAntiAffinityType: required
  monitoring:
    enablePodMonitor: false
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: "1GB"
      effective_cache_size: "3GB"
      work_mem: "8MB"
      maintenance_work_mem: "256MB"
      wal_compression: "on"
      checkpoint_completion_target: "0.9"
      # Longhorn volumes are network-backed: prefer random reads over sequential scans
      random_page_cost: "1.1"
      max_wal_size: "4GB"
      min_wal_size: "1GB"
      log_min_duration_statement: "1000"
      log_checkpoints: "on"
      log_lock_waits: "on"
      password_encryption: "scram-sha-256"
  bootstrap:
    initdb:
      database: greeniq
      owner: tb
      encoding: UTF8
      localeCType: C
      localeCollate: C
  backup:
    # Volume snapshots are kept by Longhorn: no object storage needed for the first version.
    # Add a barmanObjectStore (S3/MinIO) later to get WAL archiving + point-in-time recovery.
    volumeSnapshot:
      className: longhorn-snapshot
      snapshotOwnerReference: cluster
    target: primary
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: tb-pg-pooler-rw
  namespace: thingsboard
  labels:
    app.kubernetes.io/part-of: thingsboard
spec:
  cluster:
    name: tb-pg
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "2000"
      default_pool_size: "50"
      # required for JDBC/Hibernate prepared statements in transaction pooling mode
      max_prepared_statements: "200"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: tb-pg-daily
  namespace: thingsboard
  labels:
    app.kubernetes.io/part-of: thingsboard
spec:
  cluster:
    name: tb-pg
  # CNPG cron has 6 fields: seconds minutes hours day-of-month month day-of-week -> 02:00 every day
  schedule: "0 0 2 * * *"
  method: volumeSnapshot
  backupOwnerReference: cluster
