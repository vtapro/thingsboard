# Template only — do not commit real credentials.
#
# Create the Secret with kubectl instead of applying this file:
#
#   kubectl -n thingsboard create secret generic tb-secrets \
#     --from-literal=SPRING_DATASOURCE_USERNAME=postgres \
#     --from-literal=SPRING_DATASOURCE_PASSWORD='<password>' \
#     --from-literal=CASSANDRA_USERNAME=cassandra \
#     --from-literal=CASSANDRA_PASSWORD='<password>' \
#     --from-literal=REDIS_PASSWORD='<password>'
#
# In a GitOps setup, keep the values in the secret manager of the cluster
# (Sealed Secrets, SOPS, External Secrets, Vault) and sync them into this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: tb-secrets
  namespace: thingsboard
  labels:
    app.kubernetes.io/part-of: thingsboard
type: Opaque
stringData:
  # PostgreSQL — entities, relations, alarms, users, admin settings
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: CHANGE_ME
  # Cassandra — telemetry
  CASSANDRA_USERNAME: cassandra
  CASSANDRA_PASSWORD: CHANGE_ME
  # Redis/Valkey — shared cache
  REDIS_PASSWORD: CHANGE_ME
