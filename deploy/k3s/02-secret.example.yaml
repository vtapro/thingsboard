# Template only — do not commit real credentials.
#
# Create/refresh the Secret with kubectl instead of applying this file (the four keys below are
# exactly what the thingsboard services read):
#
#   kubectl -n thingsboard create secret generic tb-secrets \
#     --from-literal=SPRING_DATASOURCE_USERNAME='<postgres user>' \
#     --from-literal=SPRING_DATASOURCE_PASSWORD='<postgres password>' \
#     --from-literal=CASSANDRA_USERNAME='<cassandra user>' \
#     --from-literal=CASSANDRA_PASSWORD='<cassandra password>' \
#     --from-literal=CASSANDRA_SSL_TRUST_STORE_PASSWORD='<cassandra truststore password>' \
#     --from-literal=HAPROXY_STATS_USER='admin' \
#     --from-literal=HAPROXY_STATS_PASSWORD='<stats password>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# PostgreSQL runs inside the cluster (CloudNativePG on Longhorn): the username/password are the ones
# the operator generated in the `tb-pg-app` Secret. Copy them here before rolling the services, e.g.
#   kubectl -n thingsboard get secret tb-pg-app -o jsonpath='{.data.username}' | base64 -d
#   kubectl -n thingsboard get secret tb-pg-app -o jsonpath='{.data.password}' | base64 -d
# The URL and the SSL switch live in 01-config.yaml (sslmode=require).
#
# In a GitOps setup, keep the values in the secret manager of the cluster
# (Sealed Secrets, SOPS, External Secrets, Vault) and sync them into this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: tb-secrets
  namespace: thingsboard
  labels:
    app.kubernetes.io/part-of: thingsboard
type: Opaque
stringData:
  # PostgreSQL in the cluster — database "greeniq" (entities, relations, alarms, users, admin settings).
  # Must match the tb-pg-app Secret generated by CloudNativePG (13-postgres-cluster.yaml).
  SPRING_DATASOURCE_USERNAME: tb
  SPRING_DATASOURCE_PASSWORD: CHANGE_ME
  # Cassandra in the cluster (06-cassandra.yaml) runs without authentication, so these keys are
  # unused (kept for compatibility with an external Cassandra deployment).
  CASSANDRA_USERNAME: change_me_if_external_cassandra
  CASSANDRA_PASSWORD: change_me_if_external_cassandra
  CASSANDRA_SSL_TRUST_STORE_PASSWORD: change_me_if_external_cassandra
  # HAProxy statistics page (/stats, exposed only inside the cluster)
  HAPROXY_STATS_USER: admin
  HAPROXY_STATS_PASSWORD: CHANGE_ME
