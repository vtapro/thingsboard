# Template only — do not commit real credentials.
#
# Create/refresh the Secret with kubectl instead of applying this file (the four keys below are
# exactly what the thingsboard services read):
#
#   kubectl -n thingsboard create secret generic tb-secrets \
#     --from-literal=SPRING_DATASOURCE_USERNAME='<postgres user>' \
#     --from-literal=SPRING_DATASOURCE_PASSWORD='<postgres password>' \
#     --from-literal=CASSANDRA_USERNAME='<cassandra user>' \
#     --from-literal=CASSANDRA_PASSWORD='<cassandra password>' \
#     --from-literal=CASSANDRA_SSL_TRUST_STORE_PASSWORD='<cassandra truststore password>' \
#     --from-literal=HAPROXY_STATS_USER='admin' \
#     --from-literal=HAPROXY_STATS_PASSWORD='<stats password>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The managed databases have TLS enabled, so nothing else has to be added here: the URLs and the
# SSL switches live in 01-config.yaml (sslmode=require, CASSANDRA_USE_SSL=true).
#
# In a GitOps setup, keep the values in the secret manager of the cluster
# (Sealed Secrets, SOPS, External Secrets, Vault) and sync them into this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: tb-secrets
  namespace: thingsboard
  labels:
    app.kubernetes.io/part-of: thingsboard
type: Opaque
stringData:
  # Managed PostgreSQL — database "greeniq" (entities, relations, alarms, users, admin settings)
  SPRING_DATASOURCE_USERNAME: vtheanh04@gmail.com
  SPRING_DATASOURCE_PASSWORD: CHANGE_ME
  # Managed Cassandra — keyspace "greeniq" (telemetry)
  CASSANDRA_USERNAME: vtheanh04@gmail.com
  CASSANDRA_PASSWORD: CHANGE_ME
  # password of cassandra.truststore.jks (separate Secret tb-cassandra-tls holds the file)
  CASSANDRA_SSL_TRUST_STORE_PASSWORD: CHANGE_ME
  # HAProxy statistics page (/stats, exposed only inside the cluster)
  HAPROXY_STATS_USER: admin
  HAPROXY_STATS_PASSWORD: CHANGE_ME
