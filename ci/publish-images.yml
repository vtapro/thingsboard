# thi copy file nay vao .github/workflows/publish-images.yml va xoa thu muc ci/.

name: Publish ThingsBoard service images to GHCR

# ThingsBoard is a set of microservices: every service gets its own image, so deployments in k3s
# pull only what they run. The repository is built once (job "build-jars"), then the boot jar of
# each service is packaged into its own thin image (job "images").
#
#   tb-node              -> monolith / tb-core / tb-rule-engine (TB_SERVICE_TYPE selects the role)
#   tb-mqtt-transport    -> MQTT
#   tb-http-transport    -> HTTP
#   tb-coap-transport    -> CoAP
#   tb-lwm2m-transport   -> LwM2M
#   tb-snmp-transport    -> SNMP
#   tb-edqs              -> entity data query service (optional)
#   tb-vc-executor       -> version control executor (optional)

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
      - '**.md'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: vtapro
  # Product version of the fork — bump it for every release. It is pushed as an extra tag on
  # every build, next to the branch / sha / git tag tags.
  IMAGE_VERSION: v4.4.0.0
  # Version of the Maven artifacts (see <version> in pom.xml).
  TB_VERSION: 4.4.0-SNAPSHOT

jobs:
  build-jars:
    name: Build boot jars
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Builds the backend and the Angular UI, and repackages every service into a boot jar.
      # deb/rpm/zip packaging is skipped: the images only need the boot jars.
      - name: Maven install (boot jars, no deb/rpm/zip)
        run: >
          mvn -B -T 1C clean install
          -DskipTests
          -Dpkg.skip.deb=true -Dpkg.skip.rpm=true -Dpkg.skip.zip=true

      - name: Collect boot jars
        run: |
          mkdir -p dist
          cp application/target/thingsboard-${TB_VERSION}-boot.jar      dist/tb-node.jar
          cp transport/mqtt/target/tb-mqtt-transport-${TB_VERSION}-boot.jar   dist/tb-mqtt-transport.jar
          cp transport/http/target/tb-http-transport-${TB_VERSION}-boot.jar   dist/tb-http-transport.jar
          cp transport/coap/target/tb-coap-transport-${TB_VERSION}-boot.jar   dist/tb-coap-transport.jar
          cp transport/lwm2m/target/tb-lwm2m-transport-${TB_VERSION}-boot.jar dist/tb-lwm2m-transport.jar
          cp transport/snmp/target/tb-snmp-transport-${TB_VERSION}-boot.jar   dist/tb-snmp-transport.jar
          cp edqs/target/tb-edqs-${TB_VERSION}-boot.jar                       dist/tb-edqs.jar
          cp msa/vc-executor/target/tb-vc-executor-${TB_VERSION}-boot.jar     dist/tb-vc-executor.jar
          ls -lh dist

      - name: Upload boot jars
        uses: actions/upload-artifact@v4
        with:
          name: boot-jars
          path: dist/*.jar
          retention-days: 3

  images:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-jars
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # tb-node also carries the SQL/Cassandra install scripts and runs the install job
          - service: tb-node
            jar: tb-node.jar
            dockerfile: docker/msa/Dockerfile.tb-node
          - service: tb-mqtt-transport
            jar: tb-mqtt-transport.jar
            dockerfile: docker/msa/Dockerfile.service
          - service: tb-http-transport
            jar: tb-http-transport.jar
            dockerfile: docker/msa/Dockerfile.service
          - service: tb-coap-transport
            jar: tb-coap-transport.jar
            dockerfile: docker/msa/Dockerfile.service
          - service: tb-lwm2m-transport
            jar: tb-lwm2m-transport.jar
            dockerfile: docker/msa/Dockerfile.service
          - service: tb-snmp-transport
            jar: tb-snmp-transport.jar
            dockerfile: docker/msa/Dockerfile.service
          - service: tb-edqs
            jar: tb-edqs.jar
            dockerfile: docker/msa/Dockerfile.service
          - service: tb-vc-executor
            jar: tb-vc-executor.jar
            dockerfile: docker/msa/Dockerfile.service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download boot jars
        uses: actions/download-artifact@v4
        with:
          name: boot-jars
          path: dist

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ env.IMAGE_VERSION }}
            type=raw,value=latest,enable={{is_default_branch}}

      # the jar is injected through a named build context, so no file is added to the repo
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-contexts: |
            jars=dist
          build-args: |
            SERVICE_JAR=${{ matrix.jar }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
