# thi copy file nay vao .github/workflows/publish-images.yml va xoa thu muc ci/.

name: Publish images to GHCR

# Builds the single application image used by every ThingsBoard microservice
# (tb-core, tb-rule-engine, tb-transport, installer job) and pushes it to GHCR.
#
# The image is built from docker/tb-custom/Dockerfile, which runs the full Maven
# build (backend + Angular UI) inside the builder stage, so the resulting image
# can serve the web UI as well.

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
      - '**.md'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/vtapro/greeniq-backend
  # Product version of the fork — bump it for every release. It is pushed as an extra
  # tag on every build, next to the branch / sha / git tag tags.
  IMAGE_VERSION: v4.4.0.0

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ env.IMAGE_VERSION }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tb-custom/Dockerfile
          # add ",linux/arm64" (and drop the cache-to line, multi-arch does not support it)
          # when the k3s nodes are mixed architecture
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
